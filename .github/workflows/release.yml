name: Release

# Builds self-contained demo binaries for every platform and attaches them to
# the GitHub Release. Release builds set PHYSICS_STATIC_DEPS=ON, so SDL3 (and
# zlib on Windows) are built from source and linked STATICALLY — no SDL3 runtime
# to ship alongside the executables. The OpenGL backend loads through a vendored
# GLAD loader, so the demos build and run on all three platforms; macOS also gets
# the Metal backend. (Ubiquitous system libs — libGL/opengl32, libz on Unix, and
# the C++ runtime — stay dynamic, as in the reference project.)

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, runner: macos-latest, archive: physics-demo-macos-arm64.tar.gz }
          - { name: Linux, runner: ubuntu-latest, archive: physics-demo-linux-x86_64.tar.gz }
          - { name: Windows, runner: windows-latest, archive: physics-demo-windows-x86_64.zip }

    steps:
      - uses: actions/checkout@v7

      - name: Install CMake + Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "4.2.3"
          ninjaVersion: "latest"

      # --- toolchains + build deps (SDL3 is built from source, so only its
      #     system build prerequisites are needed) --------------------------------
      - name: Install LLVM (macOS)
        if: runner.os == 'macOS'
        run: brew install llvm

      - name: Install LLVM + libc++ + windowing dev libs (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          # SDL3-from-source needs the X11 + Wayland + GL/EGL development headers
          # to build its video backends.
          sudo apt-get install -y \
            clang-21 lld-21 libc++-21-dev libc++abi-21-dev \
            libgl1-mesa-dev libegl1-mesa-dev libx11-dev libxext-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev libxfixes-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev

      - name: Set up MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # --- build the demos, static deps, Release --------------------------------
      - name: Build demos (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --preset macos -DCMAKE_BUILD_TYPE=Release -DPHYSICS_STATIC_DEPS=ON
          cmake --build --preset macos

      - name: Build demos (Linux)
        if: runner.os == 'Linux'
        env:
          CC: clang-21
          CXX: clang++-21
        run: |
          json=""
          for cand in $(find /usr/lib/llvm-21 /usr/lib /usr/share -name libc++.modules.json 2>/dev/null); do
            sp="$(python3 -c 'import json,sys; m=[x for x in json.load(open(sys.argv[1])).get("modules",[]) if x.get("logical-name")=="std"]; print(m[0]["source-path"] if m else "")' "$cand")"
            [ -z "$sp" ] && continue
            case "$sp" in /*) abs="$sp" ;; *) abs="$(dirname "$cand")/$sp" ;; esac
            [ -f "$abs" ] && { json="$cand"; break; }
          done
          test -n "$json"
          # The `linux` preset defaults PHYSICS_BUILD_APPS=OFF (headless CI); the
          # release overrides it ON to build the runnable demos.
          cmake --preset linux -DCMAKE_CXX_STDLIB_MODULES_JSON="$json" \
            -DCMAKE_BUILD_TYPE=Release -DPHYSICS_BUILD_APPS=ON -DPHYSICS_STATIC_DEPS=ON
          cmake --build --preset linux

      - name: Build demos (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          cmake --preset windows -DCMAKE_BUILD_TYPE=Release -DPHYSICS_BUILD_APPS=ON -DPHYSICS_STATIC_DEPS=ON
          cmake --build --preset windows

      # --- package the runnable demos -------------------------------------------
      - name: Package demos (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          stem="${{ matrix.archive }}"; stem="${stem%.tar.gz}"
          mkdir -p dist "stage/$stem"
          for demo in sandbox ballpit cradle explosion car fireworks shooter corridor; do
            cp "build/$demo" "stage/$stem/"
          done
          cp README.md "stage/$stem/"
          cat > "stage/$stem/RUNNING.txt" <<'EOF'
          Physics Demo — self-contained demo binaries (SDL3 linked statically).
          Run any demo:  ./sandbox            (pick a backend with --backend metal|gl)
          Controls:      Esc quit · P pause · R reset (per-demo keys in README.md)
          Runtime deps:  system OpenGL (and Metal on macOS) + the LLVM libc++ runtime.
          EOF
          tar -czf "dist/${{ matrix.archive }}" -C stage "$stem"

      - name: Package demos (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stem = "${{ matrix.archive }}" -replace '\.zip$',''
          New-Item -ItemType Directory -Force -Path dist, "stage/$stem" | Out-Null
          foreach ($demo in 'sandbox','ballpit','cradle','explosion','car','fireworks','shooter','corridor') {
            Copy-Item "build/$demo.exe" "stage/$stem/"
          }
          Copy-Item README.md "stage/$stem/"
          @"
          Physics Demo — self-contained demo binaries (SDL3 + zlib linked statically).
          Run any demo:  sandbox.exe          (pick a backend with --backend gl)
          Controls:      Esc quit - P pause - R reset (per-demo keys in README.md)
          Runtime deps:  system OpenGL (opengl32) + the MSVC runtime.
          "@ | Set-Content "stage/$stem/RUNNING.txt"
          Compress-Archive -Path "stage/$stem" -DestinationPath "dist/${{ matrix.archive }}" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}

      - name: Attach to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/${{ matrix.archive }}
